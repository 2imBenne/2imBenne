name: Generate Cyberpunk Snake Animation

on:
  schedule:
    # Tự động cập nhật mỗi 12 tiếng một lần
    - cron: "0 */12 * * *"
  
  # Cho phép chạy thủ công bất cứ lúc nào trong tab Actions
  workflow_dispatch:
  
  # Tự chạy khi có thay đổi trên nhánh main hoặc master
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Cyberpunk Contribution Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300F0FF&color_dots=%2318181a,%231f2430,%23007acc,%2300f0ff,%23fcee0a

      - name: Push Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
